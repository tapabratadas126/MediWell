
name: Build MediWell Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MediWell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MediWell source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties from GitHub Secrets
        run: |
          cat << 'EOF' > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://zggutewsucelczxxxdpu.supabase.co' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_r2ELt7smORQ8Yaw5AFA7jQ_O0trUMQc' }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OCR_API_KEY=${{ secrets.OCR_API_KEY || 'K8802107826848688957' }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || 'YOUR_GOOGLE_WEB_CLIENT_ID_PLACEHOLDER' }}
          EOF

      - name: Build MediWell APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "## Gradle Build Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -C 2 -E "(e: |Compilation error|FAILURE:)" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: " build.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=Kotlin Compilation Error::$line"
            done
            exit 1
          fi

      - name: Upload MediWell APK
        uses: actions/upload-artifact@v4
        with:
          name: MediWell-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
