
name: Build MediWell Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MediWell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MediWell source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MediWell APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload MediWell APK
        uses: actions/upload-artifact@v4
        with:
          name: MediWell-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
